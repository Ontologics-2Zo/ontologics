[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ontologics"
version = "0.3.0"
description = "Evidence-backed manufacturing knowledge and review foundation"
requires-python = ">=3.10"
dependencies = ["psycopg[binary]>=3.2,<4", "rdflib>=7.1,<8", "pyshacl>=0.30,<1", "neo4j>=5.28,<7"]

[project.optional-dependencies]
test = ["pypdf==6.12.2"]

[tool.setuptools.packages.find]
include = ["ontologics*"]

[tool.setuptools.package-data]
ontologics = ["static/*.html", "static/*.css", "static/*.js"]
