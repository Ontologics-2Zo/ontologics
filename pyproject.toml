[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ontologics"
version = "0.3.0"
description = "Evidence-backed manufacturing knowledge and review foundation"
requires-python = ">=3.10"
dependencies = ["psycopg[binary]>=3.2,<4"]

[tool.setuptools.packages.find]
include = ["ontologics*"]

[tool.setuptools.package-data]
ontologics = ["static/*.html", "static/*.css", "static/*.js"]
