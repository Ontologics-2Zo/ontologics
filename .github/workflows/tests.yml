name: PostgreSQL common contract
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
        env:
          POSTGRES_USER: ontologics
          POSTGRES_PASSWORD: ci-ephemeral-only
          POSTGRES_DB: ontologics
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U ontologics -d ontologics"
          --health-interval 5s --health-timeout 5s --health-retries 20
      neo4j:
        image: neo4j:5.26-community@sha256:414adfe41c6ff32abb752be37f265c77607c166cab298f65a917fc4f05776218
        env:
          NEO4J_AUTH: neo4j/ci-ephemeral-only
          NEO4J_server_memory_heap_initial__size: 256m
          NEO4J_server_memory_heap_max__size: 512m
          NEO4J_server_memory_pagecache_size: 256m
        ports: [7687:7687]
        options: >-
          --health-cmd "wget -q --spider http://localhost:7474 || exit 1"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgresql://ontologics:ci-ephemeral-only@127.0.0.1:5432/ontologics
      TEST_DATABASE_URL: postgresql://ontologics:ci-ephemeral-only@127.0.0.1:5432/ontologics
      NEO4J_URI: bolt://127.0.0.1:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ci-ephemeral-only
      ONTOLOGICS_GRAPH_NAMESPACE: ci_graph_02
      TEST_NEO4J_URL: bolt://127.0.0.1:7687
      TEST_NEO4J_USER: neo4j
      TEST_NEO4J_PASSWORD: ci-ephemeral-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -e '.[test]'
      - name: Build reviewed parser image for sandbox regression tests
        shell: bash
        run: |
          docker build --file deploy/docker/sandbox.Dockerfile --tag ontologics-parser:ci .
          image_id=$(docker image inspect ontologics-parser:ci --format '{{.Id}}')
          docker_binary=$(command -v docker)
          printf 'ONTOLOGICS_TEST_SANDBOX_IMAGE=%s\nONTOLOGICS_TEST_DOCKER=%s\n' "$image_id" "$docker_binary" >> "$GITHUB_ENV"
      - run: python -m unittest discover -v
      - run: python -m examples.cq_check
      - run: python -m examples.agent_tools
